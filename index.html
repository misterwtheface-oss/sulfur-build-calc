<!DOCTYPE html>
<!--
  SULFUR Loadout Planner — paperdoll sandbox.
  data.js is GENERATED by build-data.mjs (window.SULFUR_DATA); labels.js maps attribute tags.
  Flow: click a slot -> category-limited selector overlay -> equip -> live stats recompute.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SULFUR Loadout Planner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>SULFUR <span class="accent">Loadout Planner</span></h1>
    <div class="header-actions">
      <button id="open-dps" type="button" class="btn-ghost">DPS</button>
      <button id="clear-loadout" type="button" class="btn-ghost">Clear</button>
    </div>
  </header>

  <main class="planner">
    <!-- WEAPONS + PER-WEAPON MODS (primary focus) -->
    <section class="panel arsenal" aria-label="Weapons">
      <h2>Arsenal</h2>
      <div id="weapon-slots" class="weapon-slots"></div>
      <div id="melee-slot" class="weapon-slots"></div>
    </section>

    <!-- CHARACTER PAPERDOLL -->
    <section class="panel character" aria-label="Character equipment">
      <h2>Character</h2>
      <div class="paperdoll">
        <div class="pd-row pd-head">
          <button class="slot slot-head" data-slot="head" data-cat="head" type="button" aria-label="Head"></button>
        </div>
        <div class="pd-row pd-mid">
          <button class="slot slot-gadget" data-slot="gadget" data-cat="gadget" type="button" aria-label="Gadget"></button>
          <button class="slot slot-torso" data-slot="torso" data-cat="torso" type="button" aria-label="Torso"></button>
          <div class="pd-side"></div>
        </div>
        <div class="pd-row pd-feet">
          <button class="slot slot-foot slot-foot-l" data-slot="footL" data-cat="feet" type="button" aria-label="Left foot"></button>
          <button class="slot slot-foot slot-foot-r" data-slot="footR" data-cat="feet" type="button" aria-label="Right foot"></button>
        </div>
      </div>
    </section>

    <!-- WEAPON DETAIL (base vs modified) — planner info panel, below the paperdoll -->
    <section class="panel weapon-detail" id="weapon-detail" hidden aria-label="Weapon detail"></section>

    <!-- EQUIPMENT DETAIL — shared matrix, one column per slot -->
    <section class="panel equip-detail" aria-label="Equipment stats">
      <h2>Equipment stats</h2>
      <div id="equip-matrix" class="equip-matrix"></div>
    </section>
  </main>

  <!-- SELECTOR OVERLAY (category-limited) -->
  <div id="overlay" class="overlay" hidden>
    <div class="overlay-box" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
      <div class="overlay-head">
        <h3 id="overlay-title">Select</h3>
        <input id="overlay-search" class="select search" type="search" placeholder="Search…" autocomplete="off" />
        <button id="overlay-close" class="btn-ghost" type="button" aria-label="Close">✕</button>
      </div>
      <div id="overlay-filters" class="overlay-filters" hidden></div>
      <div class="overlay-body">
        <div id="overlay-list" class="overlay-list"></div>
        <div id="overlay-detail" class="overlay-detail"></div>
      </div>
    </div>
  </div>

  <!-- DPS OVERLAY -->
  <div id="dps-overlay" class="overlay" hidden>
    <div class="overlay-box" role="dialog" aria-modal="true" aria-labelledby="dps-title">
      <div class="overlay-head">
        <h3 id="dps-title">DPS Simulator</h3>
        <button id="dps-close" class="btn-ghost" type="button" aria-label="Close">✕</button>
      </div>
      <div class="dps-body">
        <div class="target-row">
          <label class="target-label" for="enemy-select">Simulate vs</label>
          <select id="enemy-select" class="select" aria-label="Target enemy"></select>
        </div>
        <div id="dps" class="dps"></div>
      </div>
    </div>
  </div>

  <footer class="app-footer">
    <span id="counts" class="muted small"></span>
    <span class="muted small">Unofficial fan-made planner. Not affiliated with Perfect Random.</span>
  </footer>

  <script src="data.js"></script>
  <script src="labels.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
