<!DOCTYPE html>
<!--
  SULFUR Build Calculator — P0 skeleton.
  data.js is GENERATED by build-data.mjs (window.SULFUR_DATA); do not edit it by hand.
  P0 flow: pick a weapon -> apply Oils/Scrolls -> pick a target enemy -> live damage totals.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SULFUR Build Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>SULFUR <span class="accent">Build Calculator</span></h1>
    <p class="tagline">Weapon builder &amp; damage simulator — theorycraft before you commit in a run.</p>
  </header>

  <main class="app-main">
    <!-- 1) Weapon selector -->
    <section class="panel" id="weapon-panel" aria-label="Weapon">
      <h2>Weapon</h2>
      <input id="weapon-search" class="search" type="search" placeholder="Search weapons…" autocomplete="off" />
      <div id="weapon-selector" class="selector"></div>
    </section>

    <!-- 2) Enchantments (Oils / Scrolls) -->
    <section class="panel" id="enchant-panel" aria-label="Enchantments">
      <h2>Oils &amp; Enchantments</h2>
      <div class="row">
        <select id="enchant-group" class="search" aria-label="Filter by group"></select>
        <input id="enchant-search" class="search" type="search" placeholder="Search…" autocomplete="off" />
      </div>
      <div id="enchant-selector" class="selector tall"></div>
    </section>

    <!-- 3) Target enemy -->
    <section class="panel" id="target-panel" aria-label="Target">
      <h2>Target</h2>
      <select id="enemy-select" class="search" aria-label="Target enemy"></select>
      <div id="enemy-info" class="muted small"></div>
    </section>

    <!-- Build summary + totals -->
    <section class="panel wide" id="build-panel" aria-label="Your build">
      <h2>Your build</h2>
      <div id="build-weapon" class="build-weapon"></div>
      <div id="build-enchants" class="build-enchants"></div>
      <button id="clear-build" type="button">Clear build</button>
    </section>

    <section class="panel wide" id="totals-panel" aria-label="Totals">
      <h2>Damage vs Target</h2>
      <div id="totals" class="totals"></div>
      <details id="ledger-wrap">
        <summary>Modifier ledger (every stat your enchants touch)</summary>
        <div id="ledger" class="ledger"></div>
      </details>
    </section>
  </main>

  <footer class="app-footer">
    <span id="counts" class="muted small"></span>
    <span class="muted small">Formulas: verified from <code>_sulfur_extract</code> decompile (PROCEDURAL_MAP §1–§4).</span>
  </footer>

  <script src="data.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
